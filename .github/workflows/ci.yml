name: Frontend CI

# Validate the React frontend on every pull request.
on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege: the workflow only needs read access to repository contents.
permissions:
  contents: read

# Cancel outdated runs when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run unit tests with coverage
        run: npm test

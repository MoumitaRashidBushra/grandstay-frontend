name: Frontend CI

# Validate the React frontend on every pull request.
on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run unit tests with coverage
        run: npm test

  e2e-smoke:
    name: Playwright E2E smoke tests
    runs-on: ubuntu-latest
    needs: lint-build-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Validate staging configuration
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RECEPTIONIST_EMAIL: ${{ secrets.RECEPTIONIST_EMAIL }}
          RECEPTIONIST_PASSWORD: ${{ secrets.RECEPTIONIST_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
        run: |
          for name in STAGING_API_URL ADMIN_EMAIL ADMIN_PASSWORD \
            RECEPTIONIST_EMAIL RECEPTIONIST_PASSWORD \
            CUSTOMER_EMAIL CUSTOMER_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub secret $name is missing."
              exit 1
            fi
          done

      - name: Build frontend for staging API
        env:
          VITE_API_BASE_URL: ${{ secrets.STAGING_API_URL }}
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start frontend and run smoke tests
        env:
          TEST_ENV: staging
          FRONTEND_URL: http://localhost:5173
          API_URL: ${{ secrets.STAGING_API_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RECEPTIONIST_EMAIL: ${{ secrets.RECEPTIONIST_EMAIL }}
          RECEPTIONIST_PASSWORD: ${{ secrets.RECEPTIONIST_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
        run: |
          npm run preview -- --host localhost --port 5173 --strictPort > preview.log 2>&1 &
          PREVIEW_PID=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              echo "Frontend preview is ready."
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://localhost:5173/ > /dev/null; then
            echo "::error::Frontend preview did not start."
            cat preview.log
            kill "$PREVIEW_PID" || true
            exit 1
          fi

          cd e2e
          npm run test:staging -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

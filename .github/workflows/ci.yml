name: Frontend CI

# Validate the React frontend on every pull request by running the static
# checks and test suite before code is merged into main/master.
on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege: the workflow only needs read access to repository contents.
permissions:
  contents: read

# Cancel outdated runs when a new commit is pushed to the same PR so the
# latest validation result is always the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install the exact dependency tree from the lockfile to keep CI
      # deterministic and reproducible across runs.
      - name: Install dependencies
        run: npm ci

      # Run the project linter to catch unused code, risky patterns, and
      # style issues before test execution.
      - name: Run lint
        run: npm run lint

      # Run the Vitest suite to verify component rendering and validation logic
      # for the GrandStay frontend behave as expected in CI.
      - name: Run unit tests
        run: npm test
